version: 2
models:
- name: fct_leads
  description: >
    **Grain: one row per lead** (accumulating snapshot). Milestones of the lead lifecycle — creation,
    first response, opportunity — are columns, together with the SLA flags and activity counts.
    This is the main table for funnel, SLA and conversion analysis. Near-duplicate leads are still
    separate rows (see F05).
  data_tests:
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('stg_crm__leads')
  columns:
  - name: lead_key
    description: Surrogate key (hash of `lead_id`).
    data_tests: [unique, not_null]
  - name: lead_id
    description: Natural key from the CRM.
    data_tests: [unique, not_null]
  - name: created_date_key
    description: Local creation date as `YYYYMMDD`.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: channel_key
    description: '{{ doc("surrogate_key") }}'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_channel')
          field: channel_key
  - name: lead_source_key
    description: '{{ doc("surrogate_key") }}'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_lead_source')
          field: lead_source_key
  - name: campaign_key
    description: '''-1'' = no campaign.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_campaign')
          field: campaign_key
  - name: owner_agent_key
    description: Version of the owning agent valid on the creation date (point-in-time).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_agent')
          field: agent_key
  - name: country_code
    description: ISO 3166-1 alpha-2 country code.
  - name: industry
    description: Industry of the company (nullable).
  - name: company_size
    description: Number of employees (nullable).
  - name: company_size_band
    description: '`small`, `medium`, `large`, `enterprise` or `unknown`.'
  - name: lead_score
    description: >-
      Marketing lead score, 0-100. The main confounder of the SLA analysis (see docs/data/causal_dag.md).
  - name: email_hash
    description: Salted SHA-256 of the e-mail (pseudonymised); used to find near-duplicate leads.
  - name: created_at
    description: Creation time (UTC).
  - name: created_at_local
    description: Creation time in local time.
  - name: first_response_at
    description: Time of the first outbound interaction (UTC); null if never answered.
  - name: opportunity_opened_at
    description: When the opportunity was opened (UTC); null if not converted.
  - name: minutes_to_first_response
    description: '{{ doc("minutes_to_first_response") }}'
  - name: is_responded
    description: '{{ doc("is_responded") }}'
  - name: is_sla_met
    description: '{{ doc("is_sla_met") }}'
  - name: is_response_time_invalid
    description: First contact recorded before the lead was created (clock skew).
  - name: is_response_time_outlier
    description: First response later than `var('response_outlier_days')` days.
  - name: n_touches
    description: '{{ doc("n_touches") }}'
  - name: n_calls
    description: Number of calls.
  - name: n_emails
    description: Number of e-mails.
  - name: n_meetings
    description: Number of meetings.
  - name: n_late_records
    description: Interactions recorded more than `var('late_record_hours')` after they happened.
  - name: is_probable_duplicate
    description: >
      True if this lead is a near-duplicate of an earlier lead (same e-mail or phone).
      **Exclude from funnel and SLA analyses**: duplicates are never contacted and would
      inflate the never-answered share. See int_leads__duplicates.
    data_tests: [not_null]
  - name: duplicate_of_lead_id
    description: Master lead of the duplicate group; null if not a duplicate.
  - name: is_converted
    description: True if the lead became an opportunity.
    data_tests: [not_null]
  - name: opportunity_id
    description: '{{ doc("opportunity_id") }}'
  - name: opportunity_amount_eur
    description: Expected deal value; null when not converted.
  - name: days_to_opportunity
    description: Days from creation to opportunity; null when not converted.
- name: fct_interactions
  description: '**Grain: one row per interaction** (transaction fact).'
  data_tests:
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('stg_crm__interactions')
  columns:
  - name: interaction_key
    description: '{{ doc("surrogate_key") }}'
    data_tests: [unique, not_null]
  - name: interaction_id
    description: '{{ doc("interaction_id") }}'
  - name: lead_key
    description: '{{ doc("surrogate_key") }}'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_leads')
          field: lead_key
  - name: agent_key
    description: Version of the agent valid on the event date (point-in-time).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_agent')
          field: agent_key
  - name: event_date_key
    description: Local event date as `YYYYMMDD`.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: event_type
    description: '{{ doc("event_type") }}'
  - name: occurred_at
    description: When the contact happened (UTC).
  - name: occurred_at_local
    description: When the contact happened, in local time (`var('local_timezone')`).
  - name: recorded_at
    description: When the CRM stored the event (UTC).
  - name: duration_s
    description: '{{ doc("duration_s") }}'
  - name: recording_lag_minutes
    description: Minutes between occurrence and recording in the CRM.
  - name: is_recorded_late
    description: Stored more than `var('late_record_hours')` after it happened (timeliness).
  - name: is_first_touch
    description: This interaction is the lead's first response.

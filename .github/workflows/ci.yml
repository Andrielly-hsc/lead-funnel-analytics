# Continuous Integration: runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies and the package
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Run tests with coverage
        run: pytest --cov-report=xml
      - name: Smoke-test the CLI
        run: lead-funnel --version

  e2e:
    name: End-to-end pipeline (generate -> ingest -> dbt build)
    needs: test
    runs-on: ubuntu-latest
    env:
      LF_DATA_DIR: data
      LF_DB_PATH: data/warehouse/lead_funnel.duckdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies and the package
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Generate a small synthetic dataset
        run: lead-funnel generate --seed 42 --n-leads 2000
      - name: Ingest into the raw layer
        run: lead-funnel ingest
      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: Check source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt
      - name: Build and test all models
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Check that docs/lineage.md matches the dbt project
        run: python scripts/dbt_lineage.py --check
      - name: Profile raw data and compute the quality scorecard
        run: lead-funnel profile
      - name: Run every analytical SQL query
        run: python scripts/run_sql.py --check
      - name: Execute the notebooks top to bottom
        run: python scripts/run_notebooks.py --check

# Hooks run on `git commit`. Install once with: pre-commit install
# Run on everything with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: \.ipynb$
      # executed notebooks embed their figures; allow them more room, but still a limit
      - id: check-added-large-files
        name: check for added large notebooks
        args: ["--maxkb=1500"]
        files: \.ipynb$
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.5.0
    hooks:
      - id: sqlfluff-fix
        args: ["--show-lint-violations"]
